# Builds the site and publishes it to GitHub Pages.
# Runs on every push to main, and every morning at 6:15 AM IST so that
# approved posts go live on their date without anyone pressing a button.
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "45 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - id: pages
        uses: actions/configure-pages@v5
      - run: python3 build.py --out dist --url "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
